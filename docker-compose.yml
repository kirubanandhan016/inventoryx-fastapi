services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventoryx
      POSTGRES_USER: inventoryx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - inventoryx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventoryx -d inventoryx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://inventoryx:${POSTGRES_PASSWORD}@db:5432/inventoryx
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (at least 32 characters) in your environment}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  inventoryx-postgres-data:
